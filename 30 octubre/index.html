<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elecciones de la CAL</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <label for="vot">¿A quién quieres votar como emperador de la Confederación Artística Libre?</label>
    <p>
        <h2>
            <input type="radio" name="votasiones" value="Joaquin"> Joaquín Álvarez Sánchez (Duque de Deadly School)
        </h2>
    </p>
    <p>
        <h3>
            <input type="radio" name="votasiones" value="joaquin"> Joaquín Álvarez Sánchez (Duque de las Crónicas de Rockagentus)
        </h3>
    </p>
    <p>
        <h4>
            <input type="radio" name="votasiones" value="joako"> Joaquín Álvarez Sánchez (Duque del Expediente Cabrejas)
        </h4>
    </p>
    <header>
        <h1>Por favor, introduzca sus datos para dar pie a la votación</h1>
    </header>
    <article>
        <form action="donotdisturbmelon@gmail.com" method="post">
            <p>
                <label for="nom">Nombre</label><input type="text" name="nombre" id="nom">
                <label for="apel">Apellido</label><input type="text" id="apel" name="apellido">
            </p>
            <p>
                <label for="fnac">Fecha de Nacimiento</label><input type="date" name="fnac" id="fnac">
            </p>
            <p>
                <label for="email">Correo electrónico</label><input type="email" name="email" id="email">
                <label for="num">Número</label><input type="tel" name="numero" id="num">
                <label for="itg">Cuenta de Instagram</label><input type="text" name="insta" id="itg">
            </p>
            <p>
                <label for="frost">Foto del rostro</label><input type="file" name="fotocara" id="frost">
            </p>
            <p>
                <label for="por">País de origen</label><input type="text" name="paisorigen" id="por">
                <label for="nor">Nación de origen</label><input type="text" name="nacionorigen" id="nor">
                <label for="uo">Universo de origen</label><input type="text" name="Universo origen" id="uo">
            </p>
            <p>
                <label for="cpelo">Color de pelo</label><input type="color" name="colorpelo" id="cpelo">
                <label for="cojos">Color de ojos</label><input type="color" name="colorojos" id="cojos">
                <label for="cpiel">Color de piel</label><input type="color" name="colorpiel" id="cpiel">
            </p>
            <p>
                <label for="tcas">¿Está casado?</label>
                <input type="radio" name="tacasao" value="sí">Sí
                <input type="radio" name="tacasao" value="no">No
            </p>
            <p>
                <label for="man">¿Te gusta la manuela/dedeo?</label>
                <input type="radio" name="manuela" value="sí">Sí
                <input type="radio" name="manuela" value="no">No
            </p>
            <input type="submit" value="Enviar">
        </form>
    </article>
    <p>Dios bendiga a la Confederación</p>
    <img src="images/confederacion.jpg">
</body>
</html>
